<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开屏动画 · 设计稿 v1</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./splash.css" />

    <style>
      /* ============================================================
         下面这段只是「设计稿外壳」：假装首页在开屏后面，
         用来验收交接时机位后撤是否自然。真实组件不带这段。
         ============================================================ */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #1b2430;
        background:
          radial-gradient(120% 90% at 78% 8%, #f6faff 0%, rgba(255,255,255,0) 55%),
          linear-gradient(168deg, #eef3fa 0%, #e4eefb 42%, #d7e8f8 100%);
        min-height: 100%;
        overflow: hidden;
      }
      body.boot-lock { overflow: hidden; }

      .mock-nav {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 34px; font-size: 14px;
      }
      .mock-nav b { letter-spacing: 0.22em; font-size: 15px; }
      .mock-nav span { color: #5d6b7d; margin-left: 22px; }

      .mock-hero { padding: 12vh 34px 0; max-width: 1180px; margin: 0 auto; }
      .mock-hero h1 {
        font-size: clamp(46px, 9vw, 128px); line-height: 0.94; margin: 0;
        letter-spacing: -0.02em;
      }
      .mock-hero p { color: #5d6b7d; font-size: 17px; line-height: 1.9; max-width: 620px; margin: 22px 0 0; }
      .mock-cards { display: flex; gap: 16px; padding: 40px 34px; max-width: 1180px; margin: 0 auto; flex-wrap: wrap; }
      .mock-cards div {
        flex: 1 1 220px; min-height: 128px; border-radius: 24px;
        background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.75);
        box-shadow: 0 8px 32px rgba(70,105,160,0.1); padding: 18px;
        font-size: 13px; color: #5d6b7d;
      }

      /* 设计稿控制台：只在开屏结束、或按 R 重播时用 */
      .kit {
        position: fixed; left: 18px; bottom: 18px; z-index: 10000;
        display: none; gap: 8px; align-items: center;
        padding: 8px 10px; border-radius: 999px;
        background: rgba(255,255,255,0.78); border: 1px solid rgba(150,180,220,0.4);
        box-shadow: 0 8px 24px rgba(70,105,160,0.16);
        font-size: 12px; color: #5d6b7d; backdrop-filter: blur(12px);
      }
      body.ready .kit { display: flex; }
      .kit button {
        font: inherit; color: #1b2430; background: #fff; cursor: pointer;
        border: 1px solid rgba(150,180,220,0.5); border-radius: 999px; padding: 5px 12px;
      }
      .kit button:hover { border-color: #5b8def; color: #5b8def; }
      .kit b { color: #1b2430; }
      .kit em { font-style: normal; color: #8b98a9; margin-left: 4px; }
    </style>
  </head>
  <body>
    <!-- ================= 开屏（组件本体） ================= -->
    <div id="boot" data-act="0">
      <div class="bt-plate"></div>
      <div class="bt-grain"></div>
      <div class="bt-vignette"></div>

      <!-- 罗小黑：黑暗里先睁眼，再浮出整个剪影 -->
      <div class="bt-cat">
        <svg class="bt-cat-svg" viewBox="37 0 400 400" role="img" aria-label="罗小黑">
          <defs>
            <radialGradient id="lxIris" cx="0.42" cy="0.3" r="0.72">
              <stop offset="0" stop-color="#b6f6d8" />
              <stop offset="0.48" stop-color="#48cc99" />
              <stop offset="1" stop-color="#0f5f49" />
            </radialGradient>
            <!-- 冷光勾边：基于 alpha 的投影，叠几层就是一圈轮廓光。
                 因为形状都是同色填充、没有 stroke，接缝不会露线。 -->
            <filter id="lxRim" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#aacdff" flood-opacity="0.55" />
              <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#5b8def" flood-opacity="0.45" />
            </filter>
          </defs>

          <g class="bt-cat-body">
            <g filter="url(#lxRim)">
              <!-- 尾巴压在身体下面，根部被身体盖住 -->
              <path
                class="bt-cat-tail"
                d="M268 312 C 332 332 374 308 374 274 C 374 250 354 234 336 240"
                fill="none"
                stroke="#0a0f18"
                stroke-width="20"
                stroke-linecap="round"
              />
              <ellipse cx="200" cy="292" rx="106" ry="88" fill="#0a0f18" />
              <path d="M126 96 Q 110 54 100 14 Q 144 40 182 74 Z" fill="#0a0f18" />
              <path d="M274 96 Q 290 54 300 14 Q 256 40 218 74 Z" fill="#0a0f18" />
              <ellipse cx="200" cy="160" rx="106" ry="106" fill="#0a0f18" />
            </g>
          </g>

          <!-- 内耳偏绿，比剪影晚一点亮 -->
          <g class="bt-cat-ear">
            <path d="M132 88 Q 120 56 114 30 Q 142 44 168 68 Z" fill="#2e7355" />
            <path d="M268 88 Q 280 56 286 30 Q 258 44 232 68 Z" fill="#2e7355" />
          </g>

          <!-- 眼睛是整屏唯一的高光，先出现 -->
          <g class="bt-cat-eye">
            <ellipse cx="152" cy="164" rx="32" ry="35" fill="#f4f9ff" />
            <ellipse cx="248" cy="164" rx="32" ry="35" fill="#f4f9ff" />
            <ellipse cx="154" cy="168" rx="18" ry="24" fill="url(#lxIris)" />
            <ellipse cx="250" cy="168" rx="18" ry="24" fill="url(#lxIris)" />
            <circle cx="143" cy="152" r="9" fill="#fff" />
            <circle cx="239" cy="152" r="9" fill="#fff" />
            <circle cx="163" cy="182" r="4.2" fill="#fff" opacity="0.8" />
            <circle cx="259" cy="182" r="4.2" fill="#fff" opacity="0.8" />
          </g>

          <path class="bt-cat-nose" d="M195 215 L 205 215 L 200 222 Z" fill="rgba(255,255,255,0.5)" />
        </svg>
        <i class="bt-cat-scan"></i>
        <i class="bt-cat-live"></i>
        <i class="bt-cat-foot"></i>
      </div>

      <!-- 准星 -->
      <div class="bt-reticle">
        <svg viewBox="0 0 800 800" aria-hidden="true">
          <!-- 刻度环：用虚线假装成一圈 tick -->
          <circle cx="400" cy="400" r="286" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="9" stroke-dasharray="1 17" />
          <circle cx="400" cy="400" r="306" fill="none" stroke="rgba(91,141,239,0.45)" stroke-width="1.2" />

          <!-- 两段反向旋转的弧 -->
          <g class="bt-spin-a">
            <path d="M400 94 A 306 306 0 0 1 616 184" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.4" stroke-linecap="round" />
            <path d="M400 706 A 306 306 0 0 1 184 616" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.4" stroke-linecap="round" />
          </g>
          <g class="bt-spin-b">
            <path d="M400 120 A 280 280 0 0 1 610 300" fill="none" stroke="rgba(91,141,239,0.9)" stroke-width="1.6" stroke-linecap="round" />
            <path d="M400 680 A 280 280 0 0 1 190 500" fill="none" stroke="rgba(91,141,239,0.9)" stroke-width="1.6" stroke-linecap="round" />
          </g>

          <!-- 四个角括号 -->
          <g fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.6">
            <path d="M214 214 h52 M214 214 v52" />
            <path d="M586 214 h-52 M586 214 v52" />
            <path d="M214 586 h52 M214 586 v-52" />
            <path d="M586 586 h-52 M586 586 v-52" />
          </g>

          <!-- 十字线：中间留空，不压住标题 -->
          <g stroke="rgba(255,255,255,0.3)" stroke-width="1.2">
            <path d="M400 40 v120 M400 640 v120" />
            <path d="M40 400 h120 M640 400 h120" />
          </g>

        </svg>
      </div>

      <!-- 名称 -->
      <div class="bt-brand">
        <div class="bt-brand-1">DHUA</div>
        <div class="bt-brand-2">ARCHIVE / 2026<span class="bt-caret"></span></div>
      </div>

      <!-- 中央文案 -->
      <div class="bt-center">
        <div class="bt-zh">正在整理归档</div>
        <div class="bt-en"></div>
      </div>

      <!-- HUD -->
      <div class="bt-hud bt-hud-tl">
        DHUA · IDENTITY<br />
        PROFILE <b>WF</b> / 15 NODES<br />
        GLYPHS <b>57,254</b><br />
        BUILD <b>2026.11.03</b>
      </div>
      <div class="bt-hud bt-hex"></div>

      <!-- 四角 -->
      <i class="bt-corner bt-tl"></i>
      <i class="bt-corner bt-tr"></i>
      <i class="bt-corner bt-bl"></i>
      <i class="bt-corner bt-br"></i>

      <!-- 进度 / 跳过 -->
      <div class="bt-bar"><i></i></div>
      <button class="bt-skip" type="button" aria-label="跳过开屏">SKIP · ESC</button>

      <!-- 效果层：flash 在下、paper 在上，先过曝成纯白，再沉到站点纸色 -->
      <div class="bt-scan"></div>
      <div class="bt-glitch"></div>
      <div class="bt-flash"></div>
      <div class="bt-paper"></div>
    </div>

    <!-- ================= 开屏后面的「假首页」 ================= -->
    <div class="mock-nav">
      <b>DHUA</b>
      <div><span>笔记</span><span>标签</span><span>归档</span><span>知识库</span><span>关于</span></div>
    </div>
    <div class="mock-hero">
      <h1>把极限<br />想清楚</h1>
      <p>
        工科数学分析笔记 15 篇。每一篇回答上一篇留下的问题：从确界到一致连续，
        顺着一条线读下去，而不是按知识点背。
      </p>
    </div>
    <div class="mock-cards">
      <div>01 集合与确界<br />为什么需要实数系</div>
      <div>07 夹逼准则<br />夹逼组是怎么构造的</div>
      <div>13 一致连续<br />一个 δ 管整个区间</div>
    </div>

    <div class="kit">
      <button id="kitReplay">↻ 重播</button>
      <span>时长</span>
      <button data-mode="full">完整 6.4s</button>
      <button data-mode="quick">短版 3.3s</button>
      <span>速度</span>
      <button data-sp="0.5">0.5×</button>
      <button data-sp="1">1×</button>
      <button data-sp="2">2×</button>
      <em>R 重播 · ESC 跳过</em>
    </div>

    <script src="./splash.js"></script>
    <script>
      /* 设计稿控制台（组件不带这段） */
      document.addEventListener("boot:done", () => document.body.classList.add("ready"));

      const q = new URLSearchParams(location.search);
      const curSp = q.get("speed") || "1";
      const curMode = q.get("mode") || "full";
      const mark = (b) => (b.style.borderColor = "var(--accent)", (b.style.color = "var(--accent)"));

      document.querySelectorAll(".kit [data-sp]").forEach((b) => {
        if (b.dataset.sp === curSp) mark(b);
        b.addEventListener("click", () => {
          q.set("speed", b.dataset.sp);
          location.search = q.toString();
        });
      });
      document.querySelectorAll(".kit [data-mode]").forEach((b) => {
        if (b.dataset.mode === curMode) mark(b);
        b.addEventListener("click", () => {
          q.set("mode", b.dataset.mode);
          location.search = q.toString();
        });
      });

      /* 重播就是刷新：开屏是一次性的，重放必须重来一遍文档 */
      document.getElementById("kitReplay").addEventListener("click", () => location.reload());
      document.addEventListener("keydown", (e) => {
        if (e.key === "r" || e.key === "R") location.reload();
      });
    </script>
  </body>
</html>
